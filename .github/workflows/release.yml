name: Prepare release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full source commit SHA with successful main-branch builds
        required: true
        type: string
      checks_run:
        description: Successful Kova checks run ID for this commit
        required: true
        type: string
      desktop_run:
        description: Successful Desktop builds run ID for this commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kova-release-${{ inputs.commit }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate builds and prepare verified draft
        run: node scripts/releases/prepare.ts
        env:
          GH_TOKEN: ${{ github.token }}
          KOVA_RELEASE_COMMIT: ${{ inputs.commit }}
          KOVA_CHECKS_RUN: ${{ inputs.checks_run }}
          KOVA_DESKTOP_RUN: ${{ inputs.desktop_run }}
