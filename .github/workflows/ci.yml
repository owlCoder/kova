name: Kova checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/vscode/src/extension/ContextAttachmentManager.ts tests/unit/openai-compatible.test.ts webview/src/components/ChatFooter.tsx
      - run: git diff -- packages/vscode/src/extension/ContextAttachmentManager.ts tests/unit/openai-compatible.test.ts webview/src/components/ChatFooter.tsx
      - run: npm run check
      - run: npm run package
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: kova-vsix
          path: dist/kova-*.vsix
          if-no-files-found: error
